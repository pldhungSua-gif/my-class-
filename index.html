<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10 Toán 1 — Website lớp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast"></div>

<header class="header">
  <a class="brand" href="#home" data-page="home">
    <span class="brand-mark">∑</span>
    <span><b>10 TOÁN 1</b><small>CLASS HUB</small></span>
  </a>
  <button class="menu-btn" id="menuBtn">☰</button>
  <nav id="nav">
    <a href="#home" data-page="home">Trang chủ</a>
    <a href="#members" data-page="members">Thành viên</a>
    <a href="#ranking" data-page="ranking">Xếp hạng</a>
    <a href="#announcements" data-page="announcements">Thông báo</a>
    <a href="#schedule" data-page="schedule">Thời khóa biểu</a>
    <a href="#about" data-page="about">Về lớp</a>
  </nav>
  <button class="login-btn" id="loginBtn">Đăng nhập</button>
</header>

<main id="app"></main>

<footer>
  <div><strong>∑ 10 TOÁN 1</strong><p>Học hết mình · Chơi hết sức · Toán không đáng sợ 😎</p></div>
  <div><span>Class Hub Demo</span><span>© 2026</span></div>
</footer>

<div class="modal" id="authModal">
  <div class="modal-card">
    <button class="close" id="closeModal">×</button>
    <div class="auth-icon">∑</div>
    <h2 id="authTitle">Đăng nhập</h2>
    <p id="authDesc">Chào mừng bạn quay lại lớp!</p>
    <div id="registerNameWrap" class="hidden"><input id="registerName" placeholder="Họ và tên"></div>
    <input id="authUser" placeholder="Tên đăng nhập">
    <input id="authPass" type="password" placeholder="Mật khẩu">
    <button class="primary wide" id="submitAuth">Đăng nhập</button>
    <button class="text-btn" id="switchAuth">Chưa có tài khoản? Đăng ký</button>
  </div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
